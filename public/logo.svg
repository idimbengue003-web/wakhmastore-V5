<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    .st-bg{fill:#0A0A0A;stroke:#FFFFFF;stroke-width:0.5;stroke-miterlimit:10;}
    .st-bag{fill:none;stroke:#FFFFFF;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
    .st-handle{fill:none;stroke:#FF8A00;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
    .st-w{fill:#FFFFFF;}

    .bag-breathe {
      animation: breathe 2.8s ease-in-out infinite;
      transform-origin: 15px 15px;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag-breathe { animation: none; }
    }
  </style>
</defs>

  <path class="st-bg" d="M24.51,28.51H5.49c-2.21,0-4-1.79-4-4V5.49c0-2.21,1.79-4,4-4h19.03c2.21,0,4,1.79,4,4v19.03
    C28.51,26.72,26.72,28.51,24.51,28.51z"/>

  <g class="bag-breathe">
    <!-- Anse du sac (poignée) — accent orange Wakhma -->
    <path class="st-handle" d="M11.5,11.5 v-1.2 c0-2.2,1.6-4,3.5-4 s3.5,1.8,3.5,4 v1.2"/>

    <!-- Corps du sac -->
    <path class="st-bag" d="M8.5,11.5 h13 l-1,12.5 c-0.05,0.7-0.65,1.25-1.35,1.25 h-8.3 c-0.7,0-1.3-0.55-1.35-1.25 L8.5,11.5 z"/>

    <!-- "W" stylisé intégré au sac -->
    <path class="st-w" d="M11.2,15 l1.4,5.5 l1.4-3.8 l1.4,3.8 l1.4-5.5" />
  </g>
</svg>
