<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
         viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    .st-bg{fill:#0A0A0A;stroke:#FFFFFF;stroke-width:0.5;stroke-miterlimit:10;}
    .st-meg{fill:#1D4ED8;}
    .st-handle{fill:#FFFFFF;}
    .st-wave{fill:none;stroke:#FFFFFF;stroke-width:1.5;stroke-linecap:round;}

    .meg-breathe {
      animation: breathe 2.8s ease-in-out infinite;
      transform-origin: 15px 15px;
    }
    .wave-1 { animation: wave-pulse 2.4s ease-in-out infinite; transform-origin: 19px 15px; }
    .wave-2 { animation: wave-pulse 2.4s ease-in-out 0.25s infinite; transform-origin: 19px 15px; }
    .wave-3 { animation: wave-pulse 2.4s ease-in-out 0.5s infinite; transform-origin: 19px 15px; }

    @keyframes breathe {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    @keyframes wave-pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .meg-breathe, .wave-1, .wave-2, .wave-3 { animation: none; }
    }
  </style>
</defs>

  <path class="st-bg" d="M24.51,28.51H5.49c-2.21,0-4-1.79-4-4V5.49c0-2.21,1.79-4,4-4h19.03c2.21,0,4,1.79,4,4v19.03C28.51,26.72,26.72,28.51,24.51,28.51z"/>

  <g class="meg-breathe">
    <!-- Poignée du mégaphone (orange Wakhma) -->
    <rect x="5" y="13" width="2" height="4" class="st-handle"/>

    <!-- Corps du mégaphone (cône blanc qui s'élargit vers la droite) -->
    <path class="st-meg" d="M7,11 L7,19 L17.5,22 L17.5,8 Z"/>

    <!-- Lèvre d'ouverture (bord du mégaphone) -->
    <rect x="17" y="8" width="1.2" height="14" class="st-meg"/>
  </g>

  <!-- 3 ondes sonores qui résonnent -->
  <path class="st-wave wave-1" d="M20,12 Q21.5,15 20,18"/>
  <path class="st-wave wave-2" d="M22.5,10.5 Q25,15 22.5,19.5"/>
  <path class="st-wave wave-3" d="M25,9 Q28,15 25,21"/>
</svg>
