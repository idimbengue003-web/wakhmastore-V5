<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    .st-bg{fill:#0A0A0A;stroke:#FFFFFF;stroke-width:0.5;stroke-miterlimit:10;}
    .st-bag{fill:#FFFFFF;stroke:#FFFFFF;stroke-width:0.4;stroke-linejoin:round;}
    .st-handle{fill:none;stroke:#FFFFFF;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
    .st-w{fill:#0A0A0A;}
    .st-text{fill:#FFFFFF;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:3.4px;font-weight:700;letter-spacing:0.2px;}

    .bag-breathe {
      animation: breathe 2.8s ease-in-out infinite;
      transform-origin: 15px 15px;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bag-breathe { animation: none; }
    }
  </style>
</defs>

  <!-- Fond noir arrondi -->
  <path class="st-bg" d="M24.51,28.51H5.49c-2.21,0-4-1.79-4-4V5.49c0-2.21,1.79-4,4-4h19.03c2.21,0,4,1.79,4,4v19.03C28.51,26.72,26.72,28.51,24.51,28.51z"/>

  <g class="bag-breathe">
    <!-- Anses du sac (poignées) -->
    <path class="st-handle" d="M11,12 v-1.2 c0-2,1.8-3.6,4-3.6 s4,1.6,4,3.6 v1.2"/>

    <!-- Corps du sac (shopping bag blanc) -->
    <path class="st-bag" d="M7.5,12 h15 l-1,13 c-0.05,0.7-0.65,1.25-1.35,1.25 h-10.3 c-0.7,0-1.3-0.55-1.35-1.25 L7.5,12 z"/>

    <!-- "W" stylisé noir sur le sac -->
    <path class="st-w" d="M11.5,16 l1.3,4.5 l1.3-3.2 l1.3,3.2 l1.3-4.5" stroke="#0A0A0A" stroke-width="0.5" stroke-linejoin="round"/>
  </g>

  <!-- Texte "Wakhma Store" en bas -->
  <text x="15" y="27" text-anchor="middle" class="st-text">WAKHMA STORE</text>
</svg>
