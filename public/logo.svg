<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    .st-bg{fill:#0A0A0A;stroke:#FFFFFF;stroke-width:0.5;stroke-miterlimit:10;}
    .st-blue{fill:#2563EB;}
    .st-blue-stroke{fill:none;stroke:#2563EB;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

    .meg-breathe {
      animation: breathe 2.8s ease-in-out infinite;
      transform-origin: 15px 15px;
    }
    .wave-1 { animation: wave-pulse 2.4s ease-in-out infinite; transform-origin: 21px 15px; }
    .wave-2 { animation: wave-pulse 2.4s ease-in-out 0.25s infinite; transform-origin: 21px 15px; }
    .wave-3 { animation: wave-pulse 2.4s ease-in-out 0.5s infinite; transform-origin: 21px 15px; }

    @keyframes breathe {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    @keyframes wave-pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .meg-breathe, .wave-1, .wave-2, .wave-3 { animation: none; }
    }
  </style>
</defs>

  <!-- Fond noir arrondi -->
  <path class="st-bg" d="M24.51,28.51H5.49c-2.21,0-4-1.79-4-4V5.49c0-2.21,1.79-4,4-4h19.03c2.21,0,4,1.79,4,4v19.03C28.51,26.72,26.72,28.51,24.51,28.51z"/>

  <g class="meg-breathe">
    <!-- Poignée (grip) du mégaphone -->
    <rect x="4.5" y="17" width="3" height="5" rx="0.8" class="st-blue"/>

    <!-- Embout arrière (micro/bouche) -->
    <rect x="7" y="13" width="1.8" height="4" rx="0.6" class="st-blue"/>

    <!-- Corps du mégaphone (cône qui s'élargit vers la droite) -->
    <path class="st-blue" d="M 8.5 12.5 L 20 7.5 L 20 22.5 L 8.5 17.5 Z"/>

    <!-- Lèvre d'ouverture (bord du mégaphone) -->
    <rect x="19.5" y="7.5" width="1.8" height="15" rx="0.6" class="st-blue"/>
  </g>

  <!-- 3 ondes sonores qui résonnent -->
  <path class="st-blue-stroke wave-1" d="M 22 12 Q 23.2 15 22 18"/>
  <path class="st-blue-stroke wave-2" d="M 24 10 Q 26 15 24 20"/>
  <path class="st-blue-stroke wave-3" d="M 26 8.5 Q 28.5 15 26 21.5"/>
</svg>
